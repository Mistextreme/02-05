<!--
    This is the hidden top-level NUI page required by FiveM.

    Do not put your visible app UI here. If ui_page points directly at
    tablet.html, FiveM will show the app full screen as soon as the resource
    starts. Basically we need this hidden page to ensure the app loads correctly.
-->
<body style="margin:0;padding:0;border:0;overflow:hidden;position:fixed;inset:0;width:1px;height:1px;visibility:hidden;pointer-events:none;"></body>
